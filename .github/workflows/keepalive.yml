# Free Supabase projects are paused after 7 days without requests. This pings the database twice a
# week so sync keeps working during study breaks. Does nothing if sync is not configured.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "Sync not configured, skipping"; exit 0; fi
          curl -sf -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
